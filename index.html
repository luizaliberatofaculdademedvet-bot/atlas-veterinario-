<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071426" />
  <title>Vet Atlas 3D | Anatomia Veterinária</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071426;
      --panel: #0c2038;
      --panel-soft: #102d4b;
      --line: #17456b;
      --cyan: #42c8ff;
      --muted: #a8c7df;
      --text: #eaf5ff;
      --accent: #087eaf;
      --warning: #ffc857;
      --danger: #ff6b7a;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
    body { min-height: 100vh; }
    button, select, input { font: inherit; }
    button, select, input { border: 1px solid #23618c; border-radius: 9px; background: var(--panel-soft); color: var(--text); }
    button { cursor: pointer; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    button:hover { background: var(--accent); border-color: var(--cyan); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px clamp(18px, 4vw, 48px);
      background: #0b203b;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #123858;
      font-size: 24px;
      color: var(--cyan);
      box-shadow: inset 0 0 12px rgba(66, 200, 255, .18);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
      color: var(--cyan);
      letter-spacing: .04em;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 14px clamp(18px, 4vw, 48px);
      background: #0a1a30;
      border-bottom: 1px solid rgba(23, 69, 107, .8);
    }

    .toolbar select, .toolbar input, .toolbar button { min-height: 44px; }
    .toolbar select { padding: 0 14px; }
    .searchbox { display: flex; flex: 1; min-width: min(100%, 420px); gap: 8px; }
    .searchbox input { flex: 1; min-width: 0; padding: 0 14px; }
    .searchbox button { padding: 0 16px; }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 18px clamp(14px, 2vw, 28px);
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 300px;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      min-height: 170px;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 17px;
    }

    .system-list {
      display: grid;
      gap: 8px;
    }

    .system-button {
      width: 100%;
      padding: 11px 12px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 10px;
      font-size: 14px;
    }

    .system-button[aria-pressed="true"] {
      background: #087eaf;
      border-color: var(--cyan);
    }

    .system-icon {
      width: 22px;
      text-align: center;
      font-size: 18px;
    }

    .viewer-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .viewer-header h2 {
      margin-bottom: 3px;
    }

    .subline {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 540px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(66, 200, 255, .2);
      background: radial-gradient(circle at center, #173b5b 0%, #0a1a30 35%, #071426 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .viewer-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .viewer-tools button {
      padding: 8px 12px;
      font-size: 13px;
    }

    .viewer-tools button.active {
      background: var(--accent);
      border-color: var(--cyan);
    }

    .info { color: var(--text); line-height: 1.65; margin: 0; }

    .detail-card {
      margin-top: 14px;
      background: rgba(16, 45, 75, .8);
      border: 1px solid #23618c;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .detail-card h3 { margin: 0 0 6px; color: var(--text); font-size: 15px; }
    .detail-card p { margin: 0; color: #b8d1e5; line-height: 1.5; }

    .result-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .result-item {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(18, 47, 74, .7);
      border-color: rgba(35, 97, 140, .8);
      font-size: 14px;
    }

    .result-item small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .02em;
    }

    .empty {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 20px);
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(19, 57, 78, .96);
      border: 1px solid var(--cyan);
      color: var(--text);
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
      z-index: 20;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1000px) {
      main { grid-template-columns: 220px minmax(0, 1fr); }
      .details-panel { grid-column: 1 / -1; }
    }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      .system-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .system-button { width: 100%; }
      .canvas-wrap { min-height: 420px; }
      .toolbar { gap: 10px; }
      .searchbox { min-width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">✚</div>
      <div>
        <h1>VET ATLAS 3D</h1>
        <p>Atlas interativo de anatomia veterinária</p>
      </div>
    </div>
  </header>

  <nav class="toolbar" aria-label="Ferramentas do atlas">
    <select id="species" aria-label="Selecionar espécie">
      <option value="Cão">🐕 Canino</option>
      <option value="Gato">🐈 Felino</option>
      <option value="Cavalo">🐎 Equino</option>
      <option value="Bovino">🐄 Bovino</option>
    </select>

    <form class="searchbox" id="searchForm" role="search">
      <input id="search" type="search" placeholder="Pesquisar estrutura anatômica…" aria-label="Pesquisar estrutura anatômica" />
      <button type="submit">Pesquisar</button>
    </form>
  </nav>

  <main>
    <aside class="panel" aria-labelledby="systemsHeading">
      <h2 id="systemsHeading">Sistemas</h2>
      <div id="systemList" class="system-list"></div>
    </aside>

    <section class="panel viewer-panel" aria-labelledby="viewerTitle">
      <div class="viewer-header">
        <div>
          <h2 id="viewerTitle">Visão geral</h2>
          <div class="subline" id="speciesLabel">Canino · Cão</div>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="viewerCanvas"></canvas>
      </div>

      <div class="viewer-tools" aria-label="Camadas do modelo">
        <button type="button" class="active" data-layer="overview">Visão geral</button>
        <button type="button" data-layer="bones">Esqueleto</button>
        <button type="button" data-layer="organs">Órgãos</button>
      </div>
    </section>

    <aside class="panel details-panel" aria-labelledby="detailsHeading">
      <h2 id="detailsHeading">Informações</h2>
      <p id="systemInfo" class="info">Selecione um sistema para explorar as estruturas anatômicas.</p>

      <div class="detail-card">
        <h3 id="selectedTitle">Estrutura selecionada</h3>
        <p id="structureInfo">Nenhuma estrutura selecionada.</p>
      </div>

      <div id="results" class="result-list" aria-live="polite"></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const systems = [
      {
        name: 'Esquelético',
        icon: '🦴',
        description: 'Sustenta o corpo, protege órgãos e participa da locomoção.',
        structures: ['Crânio', 'Coluna vertebral', 'Costelas', 'Escápula', 'Úmero', 'Fêmur', 'Pelve']
      },
      {
        name: 'Muscular',
        icon: '💪',
        description: 'Conduz o movimento e a postura corporal, com atuação ativa na locomoção e estabilização.',
        structures: ['Masseter', 'Trapézio', 'Bíceps braquial', 'Diafragma', 'Glúteo médio', 'Gastrocnêmio']
      },
      {
        name: 'Nervoso',
        icon: '🧠',
        description: 'Controla funções corporais, resposta sensorial e integração dos sistemas.',
        structures: ['Encéfalo', 'Medula espinhal', 'Nervo ciático', 'Nervo óptico', 'Cerebelo']
      },
      {
        name: 'Digestório',
        icon: '🧭',
        description: 'Responsável pela ingestão, digestão, absorção e excreção de resíduos alimentares.',
        structures: ['Boca', 'Esôfago', 'Estômago', 'Fígado', 'Intestino delgado', 'Intestino grosso']
      },
      {
        name: 'Respiratório',
        icon: '🌬️',
        description: 'Permite o fluxo aéreo e a troca gasosa entre o organismo e o ambiente.',
        structures: ['Cavidade nasal', 'Laringe', 'Traqueia', 'Brônquios', 'Pulmões', 'Diafragma']
      },
      {
        name: 'Cardiovascular',
        icon: '❤️',
        description: 'Transporta sangue, oxigênio e nutrientes pelo corpo.',
        structures: ['Coração', 'Aorta', 'Veia cava', 'Artéria pulmonar', 'Veia jugular']
      },
      {
        name: 'Urinário',
        icon: '💧',
        description: 'Filtra o sangue, elimina resíduos e regula o volume e a composição dos fluidos corporais.',
        structures: ['Rins', 'Ureteres', 'Bexiga urinária', 'Uretra']
      },
      {
        name: 'Reprodutor',
        icon: '⚕️',
        description: 'Conduz a reprodução e a diferenciação sexual, variando conforme espécie e sexo.',
        structures: ['Ovários', 'Útero', 'Vagina', 'Testículos', 'Próstata', 'Pênis']
      }
    ];

    const systemList = document.getElementById('systemList');
    const resultsEl = document.getElementById('results');
    const speciesSelect = document.getElementById('species');
    const systemInfo = document.getElementById('systemInfo');
    const structureInfo = document.getElementById('structureInfo');
    const selectedTitle = document.getElementById('selectedTitle');
    const searchForm = document.getElementById('searchForm');
    const toast = document.getElementById('toast');
    const canvas = document.getElementById('viewerCanvas');
    const viewerTitle = document.getElementById('viewerTitle');
    const speciesLabel = document.getElementById('speciesLabel');
    const layerButtons = [...document.querySelectorAll('[data-layer]')];

    let selectedSystem = 'Esquelético';
    let selectedStructure = null;
    let interactives = [];
    let currentLayer = 'overview';

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function setSpeciesLabel() {
      const labels = { Cão: 'Canino', Gato: 'Felino', Cavalo: 'Equino', Bovino: 'Bovino' };
      speciesLabel.textContent = `${labels[speciesSelect.value]} · ${speciesSelect.value}`;
    }

    function renderSystems() {
      systemList.innerHTML = systems.map((system) => `
        <button
          type="button"
          class="system-button"
          data-system="${system.name}"
          aria-pressed="${selectedSystem === system.name}"
        >
          <span class="system-icon" aria-hidden="true">${system.icon}</span>
          <span>${system.name}</span>
        </button>
      `).join('');

      systemList.querySelectorAll('[data-system]').forEach((button) => {
        button.addEventListener('click', () => selectSystem(button.dataset.system));
      });
    }

    function buildResultList(items, systemName = null) {
      const results = items.map((item) => `
        <button type="button" class="result-item" data-structure="${item}" data-system="${systemName || selectedSystem}">
          ${item}
          <small>${systemName || selectedSystem}</small>
        </button>
      `).join('');

      resultsEl.innerHTML = results || '<p class="empty">Nenhuma estrutura encontrada.</p>';

      resultsEl.querySelectorAll('[data-structure]').forEach((button) => {
        button.addEventListener('click', () => {
          const name = button.dataset.structure;
          const systemName = button.dataset.system;
          selectStructure(name, systemName);
        });
      });
    }

    function selectSystem(systemName) {
      selectedSystem = systemName;
      const system = systems.find((item) => item.name === systemName);
      if (!system) return;

      renderSystems();
      viewerTitle.textContent = `Sistema ${systemName}`;
      systemInfo.textContent = `${system.description} · ${system.structures.length} estruturas disponíveis.`;
      buildResultList(system.structures, systemName);

      const structureNames = system.structures;
      selectedStructure = structureNames[0] || null;
      if (selectedStructure) {
        structureInfo.textContent = `${selectedStructure} · ${systemName}. Exemplo de estrutura do atlas para estudo anatômico.`;
        selectedTitle.textContent = selectedStructure;
      } else {
        structureInfo.textContent = 'Nenhuma estrutura selecionada.';
        selectedTitle.textContent = 'Estrutura selecionada';
      }

      highlightMeshesBySystem(systemName);
      showToast(`Sistema ${systemName} ativo`);
    }

    function selectStructure(structureName, systemName) {
      const system = systems.find((item) => item.name === systemName) || systems.find((item) => item.structures.includes(structureName));
      selectedTitle.textContent = structureName;
      structureInfo.textContent = `${structureName} — estrutura do sistema ${systemName || system?.name}. Estudo didático da anatomia veterinária. Consulte material especializado para detalhes clínicos.`;
      viewerTitle.textContent = `Estrutura: ${structureName}`;
      highlightMeshesByStructure(structureName);
      showToast(`${structureName} selecionado`);
    }

    function searchStructures(event) {
      event.preventDefault();
      const term = document.getElementById('search').value.trim().toLowerCase();
      if (!term) {
        selectSystem(selectedSystem);
        return;
      }

      const matches = systems.flatMap((system) =>
        system.structures
          .filter((name) => name.toLowerCase().includes(term))
          .map((name) => ({ name, system: system.name }))
      );

      if (!matches.length) {
        resultsEl.innerHTML = '<p class="empty">Nenhuma estrutura encontrada com esse termo.</p>';
        systemInfo.textContent = `Nenhum resultado para “${document.getElementById('search').value.trim()}”.`;
        structureInfo.textContent = 'Tente buscar por ossos, coração, cérebro, pulmão ou fêmur.';
        selectedTitle.textContent = 'Estrutura selecionada';
        return;
      }

      viewerTitle.textContent = 'Resultados da pesquisa';
      systemInfo.textContent = `${matches.length} resultado(s) encontrado(s) para “${document.getElementById('search').value.trim()}”.`;
      buildResultList(matches.map((item) => item.name), matches[0].system);
      selectedStructure = matches[0].name;
      selectedTitle.textContent = matches[0].name;
      structureInfo.textContent = `${matches[0].name} — ${matches[0].system}.`;
      highlightMeshesByStructure(matches[0].name);
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#071426');
    scene.fog = new THREE.Fog('#071426', 6, 16);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(2.8, 2.0, 5.4);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.minDistance = 3.2;
    controls.maxDistance = 9;
    controls.minPolarAngle = 0.8;
    controls.maxPolarAngle = 1.7;

    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0x9ad9ff, 1.5);
    keyLight.position.set(4, 5, 3);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x7ae0ff, 0.7);
    rimLight.position.set(-4, 2, -4);
    scene.add(rimLight);

    const animal = new THREE.Group();
    scene.add(animal);

    const materials = {
      skin: new THREE.MeshStandardMaterial({ color: 0xb7dff1, roughness: 0.8, metalness: 0.05 }),
      muscle: new THREE.MeshStandardMaterial({ color: 0x5ea2d6, transparent: true, opacity: 0.9, roughness: 0.7 }),
      bone: new THREE.MeshStandardMaterial({ color: 0xcfeaff, emissive: 0x183f5a, roughness: 0.65, metalness: 0.15 }),
      organ: new THREE.MeshStandardMaterial({ color: 0xff6b7a, emissive: 0x3d1116, roughness: 0.5 }),
      organAlt: new THREE.MeshStandardMaterial({ color: 0xfcbe54, emissive: 0x4d2f12, roughness: 0.6 }),
      highlight: new THREE.MeshStandardMaterial({ color: 0x42c8ff, emissive: 0x0b3b5e, emissiveIntensity: 0.8, roughness: 0.4 }),
      translucent: new THREE.MeshStandardMaterial({ color: 0x7bbce7, transparent: true, opacity: 0.18, roughness: 0.4 })
    };

    function createMesh(geometry, material, label, system) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.userData = { label, system, interactive: true };
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      interactives.push(mesh);
      return mesh;
    }

    function buildAnimal() {
      const body = createMesh(new THREE.SphereGeometry(1.1, 32, 32), materials.muscle, 'Tronco', 'Muscular');
      body.scale.set(1.55, 1.2, 1.0);
      body.position.set(0, 0.5, 0);
      animal.add(body);

      const head = createMesh(new THREE.SphereGeometry(0.52, 32, 32), materials.skin, 'Crânio', 'Esquelético');
      head.scale.set(1.1, 1.0, 1.05);
      head.position.set(1.85, 1.2, 0);
      animal.add(head);

      const muzzle = createMesh(new THREE.SphereGeometry(0.34, 24, 24), materials.skin, 'Muzzle', 'Digestório');
      muzzle.scale.set(1.25, 0.65, 0.8);
      muzzle.position.set(2.5, 0.95, 0);
      animal.add(muzzle);

      const neck = createMesh(new THREE.CylinderGeometry(0.22, 0.28, 0.8, 18), materials.skin, 'Pescoço', 'Muscular');
      neck.rotation.z = Math.PI / 2;
      neck.position.set(1.35, 1.2, 0);
      animal.add(neck);

      const leftLeg = createMesh(new THREE.CapsuleGeometry(0.18, 1.2, 8, 16), materials.skin, 'Pata frontal', 'Esquelético');
      leftLeg.position.set(-0.7, -1.4, 0.4);
      animal.add(leftLeg);

      const rightLeg = createMesh(new THREE.CapsuleGeometry(0.18, 1.2, 8, 16), materials.skin, 'Pata frontal', 'Esquelético');
      rightLeg.position.set(-0.7, -1.4, -0.4);
      animal.add(rightLeg);

      const leftBackLeg = createMesh(new THREE.CapsuleGeometry(0.2, 1.3, 8, 16), materials.skin, 'Pata traseira', 'Esquelético');
      leftBackLeg.position.set(0.8, -1.5, 0.4);
      animal.add(leftBackLeg);

      const rightBackLeg = createMesh(new THREE.CapsuleGeometry(0.2, 1.3, 8, 16), materials.skin, 'Pata traseira', 'Esquelético');
      rightBackLeg.position.set(0.8, -1.5, -0.4);
      animal.add(rightBackLeg);

      const tail = createMesh(new THREE.CylinderGeometry(0.08, 0.12, 1.2, 16), materials.skin, 'Cauda', 'Muscular');
      tail.rotation.z = -0.7;
      tail.position.set(-1.9, 0.3, 0);
      animal.add(tail);

      const spine = createMesh(new THREE.CylinderGeometry(0.08, 0.08, 2.5, 18), materials.bone, 'Coluna vertebral', 'Esquelético');
      spine.rotation.z = Math.PI / 2;
      spine.position.set(0, 0.2, 0);
      animal.add(spine);

      const ribCage = createMesh(new THREE.TorusGeometry(0.8, 0.08, 12, 32, Math.PI * 1.8), materials.bone, 'Costelas', 'Esquelético');
      ribCage.rotation.x = Math.PI / 2;
      ribCage.position.set(0.2, 0.2, 0);
      animal.add(ribCage);

      const heart = createMesh(new THREE.SphereGeometry(0.22, 22, 22), materials.organ, 'Coração', 'Cardiovascular');
      heart.position.set(0.2, 0.1, 0.0);
      animal.add(heart);

      const liver = createMesh(new THREE.SphereGeometry(0.45, 24, 24), materials.organAlt, 'Fígado', 'Digestório');
      liver.scale.set(1.2, 0.9, 0.9);
      liver.position.set(-0.35, 0.15, 0.05);
      animal.add(liver);

      const lungLeft = createMesh(new THREE.SphereGeometry(0.28, 20, 20), materials.organ, 'Pulmões', 'Respiratório');
      lungLeft.position.set(0.6, 0.7, 0.38);
      animal.add(lungLeft);

      const lungRight = createMesh(new THREE.SphereGeometry(0.28, 20, 20), materials.organ, 'Pulmões', 'Respiratório');
      lungRight.position.set(0.6, 0.7, -0.38);
      animal.add(lungRight);

      const stomach = createMesh(new THREE.SphereGeometry(0.34, 22, 22), materials.organAlt, 'Estômago', 'Digestório');
      stomach.scale.set(1.4, 1.0, 0.9);
      stomach.position.set(-0.9, 0.1, 0);
      animal.add(stomach);

      const brain = createMesh(new THREE.SphereGeometry(0.36, 20, 20), materials.organ, 'Encéfalo', 'Nervoso');
      brain.position.set(1.95, 1.55, 0.05);
      animal.add(brain);

      const kidneys = createMesh(new THREE.SphereGeometry(0.18, 18, 18), materials.organAlt, 'Rins', 'Urinário');
      kidneys.position.set(-0.8, -0.6, 0.32);
      animal.add(kidneys);

      const secondKidney = createMesh(new THREE.SphereGeometry(0.18, 18, 18), materials.organAlt, 'Rins', 'Urinário');
      secondKidney.position.set(-0.8, -0.6, -0.32);
      animal.add(secondKidney);

      const femur = createMesh(new THREE.CylinderGeometry(0.11, 0.11, 1.2, 18), materials.bone, 'Fêmur', 'Esquelético');
      femur.rotation.z = Math.PI / 2;
      femur.position.set(0.9, -1.9, 0.4);
      animal.add(femur);

      const humerus = createMesh(new THREE.CylinderGeometry(0.09, 0.09, 1.1, 18), materials.bone, 'Úmero', 'Esquelético');
      humerus.rotation.z = Math.PI / 2;
      humerus.position.set(-0.5, -1.7, 0.4);
      animal.add(humerus);

      const pelvis = createMesh(new THREE.TorusGeometry(0.7, 0.12, 12, 28), materials.bone, 'Pelve', 'Esquelético');
      pelvis.rotation.x = Math.PI / 2;
      pelvis.position.set(0.35, -0.8, 0);
      animal.add(pelvis);

      const trachea = createMesh(new THREE.CylinderGeometry(0.08, 0.08, 1.4, 18), materials.bone, 'Traqueia', 'Respiratório');
      trachea.rotation.z = -0.2;
      trachea.position.set(1.25, 1.2, 0);
      animal.add(trachea);

      animal.rotation.y = -0.8;
      animal.rotation.x = 0.12;
    }

    buildAnimal();

    function setLayerState(layer) {
      currentLayer = layer;
      layerButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.layer === layer);
      });

      if (layer === 'overview') {
        animal.traverse((obj) => {
          if (obj.isMesh) obj.material = obj.userData.originalMaterial || obj.material;
        });
      } else if (layer === 'bones') {
        animal.traverse((obj) => {
          if (obj.isMesh && obj.userData.system === 'Esquelético') {
            obj.material = materials.highlight;
          } else if (obj.isMesh) {
            obj.material = materials.translucent;
          }
        });
      } else if (layer === 'organs') {
        animal.traverse((obj) => {
          if (obj.isMesh && ['Cardiovascular', 'Digestório', 'Respiratório', 'Urinário', 'Nervoso'].includes(obj.userData.system)) {
            obj.material = materials.highlight;
          } else if (obj.isMesh) {
            obj.material = materials.translucent;
          }
        });
      }
    }

    animal.traverse((obj) => {
      if (obj.isMesh) {
        obj.userData.originalMaterial = obj.material;
      }
    });

    function highlightMeshesBySystem(systemName) {
      animal.traverse((obj) => {
        if (!obj.isMesh) return;
        const active = obj.userData.system === systemName;
        if (active) obj.material = materials.highlight;
        else obj.material = materials.translucent;
        if (currentLayer !== 'overview') return;
      });
      if (currentLayer === 'overview') {
        animal.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.material = obj.userData.originalMaterial || obj.material;
        });
      }
    }

    function highlightMeshesByStructure(structureName) {
      animal.traverse((obj) => {
        if (!obj.isMesh) return;
        if (obj.userData.label === structureName || obj.userData.label && obj.userData.label.includes(structureName)) {
          obj.material = materials.highlight;
        } else if (currentLayer === 'overview') {
          obj.material = obj.userData.originalMaterial || obj.material;
        } else if (currentLayer === 'bones' && obj.userData.system !== 'Esquelético') {
          obj.material = materials.translucent;
        } else if (currentLayer === 'organs' && !['Cardiovascular', 'Digestório', 'Respiratório', 'Urinário', 'Nervoso'].includes(obj.userData.system)) {
          obj.material = materials.translucent;
        }
      });
    }

    function resizeRenderer() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || canvas.clientWidth;
      const height = rect.height || canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resizeRenderer);

    canvas.addEventListener('pointerdown', (event) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hit = raycaster.intersectObjects(interactives, false)[0];
      if (!hit) return;
      const label = hit.object.userData.label;
      const system = hit.object.userData.system;
      if (label) {
        selectedTitle.textContent = label;
        structureInfo.textContent = `${label} — estrutura do sistema ${system}. Modelo esquemático para estudo de anatomia veterinária.`;
        viewerTitle.textContent = `Estrutura: ${label}`;
        showToast(`${label} selecionado`);
      }
    });

    layerButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setLayerState(button.dataset.layer);
      });
    });

    searchForm.addEventListener('submit', searchStructures);
    speciesSelect.addEventListener('change', () => {
      setSpeciesLabel();
      if (selectedSystem) selectSystem(selectedSystem);
      showToast(`Espécie: ${speciesSelect.value}`);
    });

    setSpeciesLabel();
    renderSystems();
    selectSystem(selectedSystem);
    setLayerState('overview');
    resizeRenderer();

    function animate() {
      requestAnimationFrame(animate);
      if (animal) {
        animal.rotation.y += 0.0038;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
